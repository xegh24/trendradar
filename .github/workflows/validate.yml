name: Adatok ellenőrzése

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adatfájlok érvényessége
        run: python3 scripts/validate.py
      - name: index.html naprakész-e
        run: |
          python3 scripts/build_page.py
          git diff --exit-code index.html || (echo "Futtasd: python3 scripts/build_page.py" && exit 1)
